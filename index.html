<body>
  <header class="masthead"><a class="wordmark" href="#">After dark<span class="star" aria-hidden="true">✦</span></a><span class="eyebrow">Astrophotography</span></header>
  <main>
    <section class="intro" aria-labelledby="heading"><div><p class="eyebrow">A personal collection</p><h1 id="heading">Nights spent<br><em>looking up.</em></h1></div><p class="intro-note">A few small windows<br>into a very big universe.</p></section>
    <section class="gallery" aria-label="Photograph collection">
      <figure class="wide"><a class="photo" href="nebula.jpeg" data-title="The North America Nebula" data-index="0" aria-label="View The North America Nebula in full"><img src="nebula.jpeg" width="3816" height="2140" alt="A rich red nebula threaded with dark clouds against a dense field of stars" fetchpriority="high"><span class="view">View photograph <span aria-hidden="true">↗</span></span></a><figcaption><span><span class="number">01</span> The North America Nebula</span><span class="category">Nebula</span><p class="description">A vast cloud of gas and dust where new stars are forming, named for its resemblance to North America. The red glow comes from hydrogen gas energized by hot stars, while dark clouds of dust block parts of the light.</p></figcaption></figure>
      <figure class="galaxy"><a class="photo" href="galaxy.jpeg" data-title="The Andromeda Galaxy" data-index="1" aria-label="View The Andromeda Galaxy in full"><img src="galaxy.jpeg" width="3788" height="2124" alt="An elongated galaxy with a luminous white core surrounded by blue-white stars" loading="lazy"><span class="view">View photograph <span aria-hidden="true">↗</span></span></a><figcaption><span><span class="number">02</span> The Andromeda Galaxy</span><span class="category">Galaxy</span><p class="description">Our Milky Way’s nearest large galactic neighbour, about 2.5 million light-years away, with a bright centre surrounded by a tilted disk of stars. Its light travelled for 2.5 million years to reach this photograph, so you’re seeing it as it was long before modern humans existed.</p></figcaption></figure>
      <figure class="spiral"><a class="photo" href="spiral.jpeg" data-title="The Pinwheel Galaxy" data-index="2" aria-label="View The Pinwheel Galaxy in full"><img src="spiral.jpeg" width="528" height="589" alt="A small face-on spiral galaxy with softly glowing arms in a dark star field" loading="lazy"><span class="view">View photograph <span aria-hidden="true">↗</span></span></a><figcaption><span><span class="number">03</span> The Pinwheel Galaxy</span><span class="category">Galaxy</span><p class="description">A spiral galaxy seen almost face-on, revealing arms that curl around its bright centre, roughly 21 million light-years away. About eight times farther away than Andromeda, its light began travelling toward us millions of years before humans walked the Earth.</p></figcaption></figure>
    </section>
